<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo servicio - Ac Cosmetología</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="admin-content">
        <h1>Agregar servicio nuevo</h1>
        <a href="/admin/servicios" class="volver-panel">← Volver a Servicios</a>

        <div class="admin-bloque">
            <form method="post" action="/admin/nuevo-servicio" enctype="multipart/form-data" class="form-producto">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="descripcion">Descripción (incluí el precio acá, como en el resto: ej. "$43.750/$35.000 efectivo")</label>
                <textarea id="descripcion" name="descripcion" rows="4"></textarea>

                <label for="categoria_id">Categoría</label>
                <select id="categoria_id" name="categoria_id" required>
                    {% for cat in categorias %}
                    <option value="{{ cat.id }}">{{ cat.nombre }}</option>
                    {% endfor %}
                </select>

                <label for="disponible">Disponible</label>
                <select id="disponible" name="disponible">
                    <option value="true">Sí</option>
                    <option value="false">No</option>
                </select>

                <label for="imagen">Foto</label>
                <input type="file" id="imagen" name="imagen" accept="image/*">

                <button type="submit">Crear servicio</button>
            </form>
        </div>
    </div>

    <script>
        document.querySelector('.form-producto').addEventListener('submit', function (e) {
            const descripcion = document.getElementById('descripcion').value.trim();
            if (!descripcion) {
                const continuar = confirm(
                    'Falta completar la descripción/precio. ¿Querés subirlo igual y completarlo después?'
                );
                if (!continuar) {
                    e.preventDefault();
                }
            }
        });
    </script>
</body>
</html>
