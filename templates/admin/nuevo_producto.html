<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo producto - Ac Cosmetología</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        /* Mismo recuadro que en editar_producto.html */
        .bloque-profesional { border: 1px solid #C5B5A5; border-radius: 8px; padding: 12px 16px; margin: 8px 0; }
        .bloque-profesional legend { padding: 0 6px; color: #3B2B23; font-weight: 600; }
        .check-profesional { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
        .check-profesional input { width: auto; }
        .ganancia { font-size: 0.9em; color: #8C7A67; margin: 4px 0 0; }
    </style>
</head>
<body>
    <div class="admin-content">
        <h1>Agregar producto nuevo</h1>
        <a href="/admin/panel" class="volver-panel">← Volver al panel</a>

        <div class="admin-bloque">
            <form method="post" action="/admin/nuevo-producto" enctype="multipart/form-data" class="form-producto">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" name="descripcion"></textarea>

                <label for="precio">Precio de lista (débito/crédito)</label>
                <input type="number" step="0.01" id="precio" name="precio" required>

                <label for="precio_contado">Precio de contado (efectivo/transferencia) — opcional</label>
                <input type="number" step="0.01" min="0" id="precio_contado" name="precio_contado">
                <p class="ganancia" id="descuento-contado"></p>

                <fieldset class="bloque-profesional">
                    <legend>Distribuidora / profesionales</legend>

                    <label for="precio_profesional">Precio profesional (opcional: si queda vacío, a las profesionales les aparece el público)</label>
                    <input type="number" step="0.01" min="0" id="precio_profesional" name="precio_profesional">

                    <label for="costo">Costo (precio distribuidor, lo ves solo vos)</label>
                    <input type="number" step="0.01" min="0" id="costo" name="costo">

                    <p class="ganancia" id="ganancia"></p>

                    <label class="check-profesional">
                        <input type="checkbox" name="solo_profesionales" value="true">
                        Solo para profesionales (producto de gabinete, el público no lo ve)
                    </label>
                </fieldset>

                <label for="categoria_id">Categoría</label>
                <select id="categoria_id" name="categoria_id" required>
                    {% for cat in categorias %}
                    <option value="{{ cat.id }}">{{ cat.nombre }}</option>
                    {% endfor %}
                </select>

                <label for="marca_id">Marca</label>
                <select id="marca_id" name="marca_id">
                    <option value="">— Sin marca —</option>
                    {% for marca in marcas %}
                    <option value="{{ marca.id }}">{{ marca.nombre }}</option>
                    {% endfor %}
                </select>

                <label for="stock">Stock (cuántas unidades quedan)</label>
                <input type="number" step="1" min="0" id="stock" name="stock" value="0" required>

                <label for="disponible">Disponible</label>
                <select id="disponible" name="disponible">
                    <option value="true">Sí</option>
                    <option value="false">No</option>
                </select>

                <label for="imagenes">Fotos (podés elegir varias)</label>
                <input type="file" id="imagenes" name="imagenes" accept="image/*" multiple>

                <button type="submit">Crear producto</button>
            </form>
        </div>
    </div>

    <script>
        // Muestra en vivo cuánto ganás por unidad, mientras escribís los precios
        function actualizarGanancia() {
            const costo = parseFloat(document.getElementById('costo').value);
            const profesional = parseFloat(document.getElementById('precio_profesional').value);
            const publico = parseFloat(document.getElementById('precio').value);
            const contado = parseFloat(document.getElementById('precio_contado').value);
            const ars = n => '$' + Math.round(n).toLocaleString('es-AR');
            const partes = [];
            if (costo > 0 && profesional > 0) partes.push('vendiendo a profesional: ' + ars(profesional - costo));
            if (costo > 0 && publico > 0) partes.push('vendiendo al público (lista): ' + ars(publico - costo));
            if (costo > 0 && contado > 0) partes.push('al contado: ' + ars(contado - costo));
            document.getElementById('ganancia').textContent = partes.length ? 'Ganás por unidad ' + partes.join(' · ') : '';

            // Cuánto más barato sale de contado, en % sobre el precio de lista
            const textoDescuento = (publico > 0 && contado > 0)
                ? 'De contado sale ' + Math.round((1 - contado / publico) * 100) + '% menos que de lista'
                : '';
            document.getElementById('descuento-contado').textContent = textoDescuento;
        }
        ['costo', 'precio_profesional', 'precio', 'precio_contado'].forEach(id =>
            document.getElementById(id).addEventListener('input', actualizarGanancia));

        document.querySelector('.form-producto').addEventListener('submit', function (e) {
            const descripcion = document.getElementById('descripcion').value.trim();
            const precio = document.getElementById('precio').value;

            if (!descripcion || !precio || parseFloat(precio) === 0) {
                const continuar = confirm(
                    'Falta completar la descripción o el precio. ¿Querés subirlo igual y completarlo después?'
                );
                if (!continuar) {
                    e.preventDefault();
                }
            }
        });
    </script>
</body>
</html>
