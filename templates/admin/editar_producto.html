<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar producto - Ac Cosmetología</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="admin-content">
        <h1>Editar producto</h1>
        <a href="/admin/panel" class="volver-panel">← Volver al panel</a>

        <div class="admin-bloque">
            {% if producto.imagen %}
            <img src="{{ producto.imagen }}" alt="{{ producto.nombre }}" class="imagen-actual">
            {% endif %}

            <form method="post" action="/admin/editar-producto/{{ producto.id }}" enctype="multipart/form-data" class="form-producto">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" value="{{ producto.nombre }}" required>

                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" name="descripcion">{{ producto.descripcion or "" }}</textarea>

                <label for="precio">Precio</label>
                <input type="number" step="0.01" id="precio" name="precio" value="{{ producto.precio }}" required>

                <label for="categoria_id">Categoría</label>
                <select id="categoria_id" name="categoria_id" required>
                    {% for cat in categorias %}
                    <option value="{{ cat.id }}" {% if cat.id == producto.categoria_id %}selected{% endif %}>{{ cat.nombre }}</option>
                    {% endfor %}
                </select>

                <label for="marca_id">Marca</label>
                <select id="marca_id" name="marca_id">
                    <option value="">— Sin marca —</option>
                    {% for marca in marcas %}
                    <option value="{{ marca.id }}" {% if producto.marca_id and marca.id == producto.marca_id %}selected{% endif %}>{{ marca.nombre }}</option>
                    {% endfor %}
                </select>

                <label for="disponible">Disponible</label>
                <select id="disponible" name="disponible">
                    <option value="true" {% if producto.disponible %}selected{% endif %}>Sí</option>
                    <option value="false" {% if not producto.disponible %}selected{% endif %}>No</option>
                </select>

                <label for="imagen">Cambiar foto (opcional)</label>
                <input type="file" id="imagen" name="imagen" accept="image/*">

                <button type="submit">Guardar cambios</button>
            </form>
        </div>
    </div>

    <script>
        document.querySelector('.form-producto').addEventListener('submit', function (e) {
            const descripcion = document.getElementById('descripcion').value.trim();
            const precio = document.getElementById('precio').value;

            if (!descripcion || !precio || parseFloat(precio) === 0) {
                const continuar = confirm(
                    'Falta completar la descripción o el precio. ¿Querés guardarlo igual y completarlo después?'
                );
                if (!continuar) {
                    e.preventDefault();
                }
            }
        });
    </script>
</body>
</html>
